<title>Ruta IA Montblanc</title>
<style>
  /* Layout: recorrido guiado en una sola columna centrada (max ~660px);
     barra de marca arriba, progreso, tarjeta de contenido, cierre editorial.
     Paleta alpina/cumbre: tinta pizarra fría, nieve, acento glaciar + ámbar para el regalo. */
  :root{
    --bg:#f3ecdf; --surface:#ffffff; --surface-2:#f8f3ea;
    --ink:#2c3a4f; --muted:#6f7788; --line:#e6ddcd;
    --accent:#284267; --accent-ink:#284267; --accent-soft:rgba(40,66,103,.08);
    --terra:#a8492f; --terra-soft:rgba(168,73,47,.10);
    --navy:#223a5e; --navy-2:#1a2d49; --navy-line:rgba(255,255,255,.16);
    --gift:#a9772f; --gift-ink:#8a5f1f; --gift-soft:rgba(169,119,47,.12);
    --good:#2f7d5c; --shadow:rgba(40,50,70,.13);
    --font-ui:Tahoma,Verdana,Geneva,"Segoe UI",sans-serif;
    --font-display:Tahoma,Verdana,Geneva,"Segoe UI",sans-serif;
  }

  *{box-sizing:border-box}
  body{background:var(--bg);
    background:radial-gradient(130% 120% at 82% -5%, #fcf8f1 0%, #f3ecdf 52%, #ece2d2 100%) fixed;
    color:var(--ink);font-family:var(--font-ui);
    line-height:1.55;-webkit-font-smoothing:antialiased;margin:0;overflow-x:hidden}
  .wrap{max-width:720px;margin:0 auto;padding-inline:20px;padding-block:0}

  /* Marca */
  .topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;
    background:color-mix(in srgb,var(--bg) 88%,transparent);
    backdrop-filter:saturate(1.2) blur(8px);border-bottom:1px solid var(--line)}
  .topbar .wrap{display:flex;align-items:center;gap:10px;height:56px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:.14em;
    text-transform:uppercase;font-size:12px;line-height:1;color:var(--ink)}
  .brand svg{display:block}
  .brand .wm{display:inline-flex;align-items:baseline;gap:7px}
  .brand small{color:var(--muted);font-weight:500;letter-spacing:.06em}
  .topbar .tagline{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
    font-weight:600;padding-left:14px;margin-left:4px;border-left:1px solid var(--line);white-space:nowrap}
  @media (max-width:560px){ .topbar .tagline{display:none} }
  .topbar .spacer{flex:1}
  .ghost{appearance:none;border:1px solid var(--line);background:var(--surface);
    color:var(--muted);font-family:inherit;font-size:12.5px;font-weight:500;
    padding:6px 12px;border-radius:999px;cursor:pointer}
  .ghost:hover{color:var(--ink);border-color:var(--accent)}

  main{padding-block:28px 64px}
  .anim{animation:rise .38s cubic-bezier(.2,.7,.2,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.anim{animation:none}}

  /* Progreso: stepper del proceso completo, termina en Roadmap */
  .stepper{display:flex;align-items:flex-start;gap:0;margin:2px 0 24px;overflow-x:auto;
    padding-bottom:4px;-webkit-overflow-scrolling:touch}
  .pstep{display:flex;flex-direction:column;align-items:center;gap:6px;flex:none;min-width:56px}
  .pnode{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;
    font-weight:700;background:var(--surface);border:2px solid var(--line);color:var(--muted);
    font-variant-numeric:tabular-nums}
  .pnode svg{width:13px;height:13px}
  .pstep.done .pnode{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
  .pstep.cur .pnode{border-color:var(--accent);background:var(--accent);color:#fff}
  .pstep.goal .pnode{border-color:var(--gift);color:var(--gift-ink);background:var(--gift-soft)}
  .pstep.goal.cur .pnode{background:var(--gift);border-color:var(--gift);color:#fff}
  .plabel{font-size:10.5px;letter-spacing:.01em;color:var(--muted);white-space:nowrap}
  .pstep.cur .plabel{color:var(--ink);font-weight:600}
  .pstep.goal .plabel{color:var(--gift-ink);font-weight:600}
  .pline{flex:1;min-width:12px;height:2px;background:var(--line);margin:13px 2px 0}
  .pline.on{background:var(--accent)}

  .eyebrow{text-transform:uppercase;letter-spacing:.16em;font-size:11.5px;font-weight:600;
    color:var(--accent-ink)}
  h1{font-family:var(--font-display);font-weight:500;font-size:clamp(28px,6vw,40px);
    line-height:1.08;letter-spacing:-.01em;text-wrap:balance;margin:.4em 0 .3em}
  .q-title{font-family:var(--font-display);font-weight:500;font-size:clamp(23px,5vw,30px);
    line-height:1.12;text-wrap:balance;margin:.2em 0 .25em}
  .lead{color:var(--muted);font-size:16px;max-width:60ch}
  .q-help{color:var(--muted);font-size:14.5px;margin:.2em 0 20px;max-width:58ch}

  /* Portada: citas de apertura */
  .cover-quote{font-family:var(--font-display);font-size:clamp(20px,4.4vw,27px);
    line-height:1.28;font-style:italic;text-wrap:balance;margin:0}
  .cover-quote .by{display:block;font-style:normal;font-size:14px;letter-spacing:.04em;
    color:var(--accent-ink);margin-top:12px;font-family:var(--font-ui);font-weight:600}
  .quote-rule{height:1px;background:var(--line);margin:22px 0}
  .mini-quotes{display:grid;gap:14px}
  .mini-quotes .mq{font-size:14.5px;color:var(--muted);padding-left:14px;
    border-left:2px solid var(--line)}
  .mini-quotes .mq b{color:var(--ink);font-weight:600}
  .eqq{font-family:var(--font-display);font-style:italic;font-size:clamp(17px,3.3vw,20px);
    line-height:1.3;text-wrap:balance;margin:18px 0}
  .eqq .by{display:block;font-style:normal;font-family:var(--font-ui);font-weight:600;
    font-size:13px;letter-spacing:.04em;color:var(--accent-ink);margin-top:9px}
  .how{display:flex;gap:14px;flex-wrap:wrap;margin:24px 0 8px}
  .how .pill{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted);
    background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 14px}
  .how .n{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;
    background:var(--accent-soft);color:var(--accent-ink);font-size:12px;font-weight:600}

  /* ===== Portada editorial (estilo colección) ===== */
  .hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(36px,4.5vw,92px);align-items:center;
    min-height:calc(100vh - 118px);
    width:min(1440px, calc(100vw - 48px));
    margin-inline:calc(50% - min(720px, (100vw - 48px)/2)) auto}
  @media (max-width:720px){ .hero{grid-template-columns:1fr;gap:24px;min-height:0;padding-top:6px;width:auto;margin-inline:0} }
  .hero .eyebrow{color:var(--terra)}
  .hero h1{font-weight:700;font-size:clamp(28px,3.9vw,50px);line-height:1.08;letter-spacing:-.015em;margin:.2em 0 .35em}
  .hero .lead{font-size:clamp(15.5px,1.6vw,17.5px);max-width:46ch}
  .explore-hint{text-align:center;margin:18px 0 2px;color:var(--muted);font-size:11px;letter-spacing:.18em;
    text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:12px}
  .explore-hint::before,.explore-hint::after{content:"";height:1px;width:46px;background:var(--line)}
  .ctx-chip{display:inline-flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);
    border-radius:999px;padding:8px 15px;font-size:13px;color:var(--muted);margin:24px 0 2px;
    box-shadow:0 8px 22px -16px var(--shadow)}
  .ctx-chip .dot{width:8px;height:8px;border-radius:50%;background:var(--terra);flex:none}
  .ctx-chip b{color:var(--ink)}
  .hero-cta{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-top:22px}
  .btn.lg{font-size:16.5px;padding:16px 26px;border-radius:14px}
  .link-btn{appearance:none;background:none;border:0;cursor:pointer;font-family:inherit;font-weight:600;
    font-size:15px;color:var(--accent-ink);display:inline-flex;align-items:center;gap:8px;padding:6px 2px}
  .link-btn:hover{color:var(--terra)}

  /* Rastreador "Tu recorrido" */
  .recorrido{display:inline-flex;align-items:center;gap:13px;background:var(--navy);color:#fff;
    border-radius:14px;padding:10px 17px 10px 12px;margin-top:30px}
  .recorrido .steps{display:flex;gap:6px}
  .recorrido .s{width:27px;height:27px;border-radius:8px;display:grid;place-items:center;font-size:11px;
    font-weight:700;background:rgba(255,255,255,.12);color:rgba(255,255,255,.72);font-variant-numeric:tabular-nums}
  .recorrido .s.on{background:#fff;color:var(--navy)}
  .recorrido .lab{font-size:12.5px;line-height:1.25}
  .recorrido .lab b{display:block;font-size:13px}
  .recorrido .lab span{color:rgba(255,255,255,.7)}

  /* Mapa orbital (portada, desktop) */
  .orbit{position:relative;width:100%;max-width:560px;aspect-ratio:1/1;margin:0 auto}
  .orbit .ring{position:absolute;border:1px solid var(--line);border-radius:50%;inset:4%;opacity:.95}
  .orbit .ring.r2{inset:17%}
  .orbit .ring.r3{inset:29%}
  .orbit .hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:42%;height:42%;
    border:0;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;text-align:center;
    padding:10px;box-shadow:0 26px 58px -24px rgba(34,58,94,.6),0 0 0 10px rgba(34,58,94,.05);
    font-family:inherit;cursor:pointer;transition:transform .16s,box-shadow .16s,background .16s}
  .orbit .hub.hub-cta:hover{background:var(--navy-2);transform:translate(-50%,-50%) scale(1.05);
    box-shadow:0 32px 68px -22px rgba(34,58,94,.72),0 0 0 13px rgba(34,58,94,.09)}
  .orbit .hub .k{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;opacity:.72}
  .orbit .hub .t{font-size:clamp(18px,2.7vw,25px);font-weight:700;line-height:1.08;margin-top:5px}
  .orbit .hub .hub-go{display:block;margin-top:6px;font-size:19px;opacity:.9}
  .onode{position:absolute;width:40%;max-width:196px;background:var(--surface);border:1px solid var(--line);
    border-radius:16px;padding:14px 16px;box-shadow:0 16px 36px -20px var(--shadow);
    text-align:left;color:inherit}
  .onode .num{display:block;font-size:11px;letter-spacing:.14em;color:var(--muted);font-weight:700}
  .onode .lbl{display:block;font-size:15.5px;font-weight:700;line-height:1.18;margin-top:5px;color:var(--ink)}
  .onode.p1{left:0;top:4%} .onode.p2{right:0;top:15%}
  .onode.p3{right:0;bottom:7%} .onode.p4{left:0;bottom:14%}
  @media (max-width:720px){ .hero-art{display:none} }

  /* ===== Pantalla navy de temas ("territorios") ===== */
  .navy-screen{background:linear-gradient(158deg,var(--navy),var(--navy-2));color:#fff;border-radius:24px;
    padding:clamp(20px,3.6vw,38px);margin-top:2px;position:relative;overflow:hidden}
  .navy-screen::after{content:"";position:absolute;width:360px;height:360px;right:-80px;top:-120px;
    background:radial-gradient(circle,rgba(231,201,189,.14),transparent 70%);pointer-events:none}
  .navy-screen .eyebrow{color:#e7c9bd}
  .navy-screen h2.q-title{color:#fff}
  .navy-screen .sub{color:rgba(255,255,255,.72);font-size:14.5px;max-width:58ch}
  .terr-hub{max-width:60ch;position:relative;z-index:1}
  .terr-hub .k{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.5);font-weight:600}
  .terr-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px;position:relative;z-index:1}
  @media (max-width:620px){ .terr-grid{grid-template-columns:1fr} }
  .terr{display:block;text-align:left;font-family:inherit;color:#fff;cursor:pointer;
    background:rgba(255,255,255,.055);border:1px solid var(--navy-line);border-radius:16px;padding:18px 18px;
    transition:background .15s,border-color .15s,transform .1s}
  .terr:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.42);transform:translateY(-2px)}
  .terr[aria-current="true"]{border-color:#e7c9bd;background:rgba(231,201,189,.13)}
  .terr .num{font-size:11px;letter-spacing:.12em;color:rgba(255,255,255,.55);font-weight:700}
  .terr .tt{display:block;font-size:19px;font-weight:700;margin:6px 0 5px;line-height:1.12}
  .terr .dd{display:block;font-size:13.5px;color:rgba(255,255,255,.72);line-height:1.42}
  .terr .go{font-size:12.5px;color:#e7c9bd;font-weight:600;margin-top:12px;display:inline-flex;gap:6px}
  .back.on-dark{color:rgba(255,255,255,.75);position:relative;z-index:1}
  .back.on-dark:hover{color:#fff}

  /* Stepper sobre fondo navy */
  .stepper.on-dark{position:relative;z-index:1}
  .stepper.on-dark .pnode{background:rgba(255,255,255,.08);border-color:var(--navy-line);color:rgba(255,255,255,.7)}
  .stepper.on-dark .pstep.done .pnode{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.4);color:#fff}
  .stepper.on-dark .pstep.cur .pnode{background:#fff;border-color:#fff;color:var(--navy)}
  .stepper.on-dark .pstep.goal .pnode{background:var(--gift);border-color:var(--gift);color:#fff}
  .stepper.on-dark .plabel{color:rgba(255,255,255,.6)}
  .stepper.on-dark .pstep.cur .plabel{color:#fff}
  .stepper.on-dark .pstep.goal .plabel{color:#e6c688}
  .stepper.on-dark .pline{background:var(--navy-line)} .stepper.on-dark .pline.on{background:rgba(255,255,255,.75)}

  /* Banda de citas de apertura */
  .quotes-band{margin:46px 0 8px;border-top:1px solid var(--line);padding-top:28px}
  .qb-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:16px}
  @media (max-width:760px){ .qb-grid{grid-template-columns:1fr} }
  .qcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;margin:0;
    font-size:15px;line-height:1.42;font-style:italic;color:var(--ink);box-shadow:0 12px 32px -24px var(--shadow)}
  .qcard .by{display:block;font-style:normal;font-weight:700;font-size:12.5px;letter-spacing:.04em;
    color:var(--accent-ink);margin-top:12px}

  /* Botones */
  .btn{appearance:none;-webkit-appearance:none;border:0;cursor:pointer;font-family:inherit;font-weight:600;
    font-size:15.5px;padding:13px 22px;border-radius:12px;background:#284267;background:var(--accent);color:#fff;
    display:inline-flex;align-items:center;gap:9px;transition:transform .08s ease,filter .15s}
  .btn:hover{filter:brightness(1.06)} .btn:active{transform:translateY(1px)}
  .btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
  .btn.full{width:100%;justify-content:center}
  .back{display:inline-flex;align-items:center;gap:7px;background:none;border:0;cursor:pointer;
    color:var(--muted);font-family:inherit;font-size:14px;font-weight:500;padding:8px 0;margin-bottom:6px}
  .back:hover{color:var(--accent)}
  .row-actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:8px}

  /* Tarjetas de opción (tema / stack / nivel) */
  .options{display:grid;gap:12px}
  .opt{display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;
    background:var(--surface);border:1.5px solid var(--line);border-radius:14px;
    padding:16px 17px;cursor:pointer;font-family:inherit;color:inherit;
    transition:border-color .15s,box-shadow .15s,transform .08s}
  .opt:hover{border-color:var(--accent);box-shadow:0 6px 20px -12px var(--shadow)}
  .opt:active{transform:translateY(1px)}
  .opt[aria-current="true"]{border-color:var(--accent);background:var(--accent-soft)}
  .opt .ic{flex:none;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;
    background:var(--accent-soft);color:var(--accent-ink)}
  .opt .ic svg{width:22px;height:22px}
  .opt .ttl{font-weight:600;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .opt .tag{font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--muted);
    border:1px solid var(--line);border-radius:6px;padding:1px 7px}
  .opt .d{color:var(--muted);font-size:14px;margin-top:3px}
  .opt .chev{margin-left:auto;align-self:center;color:var(--line)}
  .opt:hover .chev{color:var(--accent)}
  .opt .ic.num{font-weight:700;color:var(--accent-ink);font-size:15px;font-family:var(--font-display);
    font-variant-numeric:tabular-nums}

  /* Pregunta editorial de dos paneles (rompe el "formulario vertical") */
  .ask-wrap{width:min(1060px, calc(100vw - 48px));
    margin-inline:calc(50% - min(530px, (100vw - 48px)/2)) auto}
  .ask{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(28px,4vw,60px);
    align-items:start;margin-top:8px}
  .ask-copy{position:relative}
  .ask-copy .back{margin-bottom:10px}
  .ask-num{font-family:var(--font-display);font-weight:700;font-size:clamp(50px,7vw,88px);
    line-height:.85;letter-spacing:-.03em;color:var(--accent);opacity:.13}
  .ask-eyebrow{color:var(--terra);text-transform:uppercase;letter-spacing:.16em;font-size:12px;
    font-weight:700;margin:12px 0 7px}
  .ask-title{font-family:var(--font-display);font-weight:500;font-size:clamp(25px,3.3vw,40px);
    line-height:1.08;letter-spacing:-.01em;margin:0 0 .4em;color:var(--ink)}
  .ask-help{color:var(--muted);font-size:14.5px;line-height:1.55;max-width:40ch}
  .ask-options{display:grid;gap:12px;align-content:start}
  @media(max-width:760px){
    .ask-wrap{width:auto;margin-inline:0}
    .ask{grid-template-columns:1fr;gap:16px}
    .ask-num{display:none}
  }

  /* Roadmap como "dossier" de dos columnas */
  .road-wrap{width:min(1120px, calc(100vw - 48px));
    margin-inline:calc(50% - min(560px, (100vw - 48px)/2)) auto}
  .road-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px 28px;flex-wrap:wrap;margin:8px 0 2px}
  .road-head-main{min-width:280px;flex:1}
  .road-title{font-family:var(--font-display);font-weight:500;font-size:clamp(28px,4vw,46px);
    line-height:1.03;letter-spacing:-.01em;margin:.1em 0 .22em;color:var(--ink)}
  .road-sub{color:var(--muted);font-size:14.5px;max-width:52ch;margin:0 0 10px}
  .road-recap{color:var(--ink);font-size:16px;line-height:1.6;max-width:62ch;margin:6px 0 6px}
  .road-recap b{color:var(--navy);font-weight:600}
  .road-recap-edit{color:var(--muted);font-size:13px;margin:0 0 4px}
  .road-head-side{flex:none}
  .road-grid{display:grid;grid-template-columns:minmax(0,1.32fr) minmax(0,1fr);gap:22px;align-items:start;margin-top:8px}
  .road-main{min-width:0}
  .road-side{position:sticky;top:16px;display:grid;gap:16px;min-width:0}
  .road-main > .block:first-child,.road-side > .block:first-child{margin-top:0}
  @media(max-width:900px){
    .road-wrap{width:auto;margin-inline:0}
    .road-grid{grid-template-columns:1fr;gap:4px}
    .road-side{position:static}
  }

  /* Resultado */
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px}
  .chip{display:inline-flex;align-items:center;gap:7px;background:var(--surface);
    border:1px solid var(--line);border-radius:999px;padding:6px 8px 6px 13px;font-size:13px;
    color:var(--ink);cursor:pointer;font-family:inherit}
  .chip:hover{border-color:var(--accent)}
  .chip .k{color:var(--muted);font-size:11px;letter-spacing:.04em;text-transform:uppercase}
  .chip .edit{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;
    background:var(--surface-2);color:var(--muted);font-size:11px}

  .block{background:var(--surface);border:1px solid var(--line);border-radius:16px;
    padding:20px;margin-top:16px}
  .block > .head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
  .block .kicker{text-transform:uppercase;letter-spacing:.14em;font-size:11px;font-weight:700;
    color:var(--accent-ink)}
  .block h3{font-family:var(--font-display);font-weight:500;font-size:21px;margin:.1em 0 .3em;line-height:1.15}
  .block p.sub{color:var(--muted);font-size:14.5px;margin:.1em 0 0}

  .prompt-card{background:var(--surface-2);border:1px dashed var(--line);border-radius:12px;
    padding:15px 16px;margin-top:12px;font-size:14.5px;line-height:1.5}

    width:2px;background:var(--line)}

    border:2px solid var(--line);display:grid;place-items:center;font-size:12.5px;font-weight:700;

function entryIndex(){
  var ia=nivelIA();
  if(!ia) return 0;
  // Investigación: no hay nivel del tema; el nivel de IA define el punto de entrada.
  if(!temaUsaNivelTema()) return {basico:0, medio:1, avanzado:2}[ia.id];
  var tm=nivelTema();
  if(!tm) return 0;
  if(ia.id==='basico') return 0;
  return {basico:0, medio:1, avanzado:2}[tm.id];
}

/* Stepper del proceso completo; termina siempre en Roadmap. */
function stepper(cur, dark){
  var seq=[{k:'tema',l:'Objetivo'},{k:'stack',l:'Herramienta'},{k:'nivelIA',l:'Nivel IA'}];
  if(temaUsaNivelTema()) seq.push({k:'nivelTema',l:'Nivel tema'});
  seq.push({k:'roadmap',l:'Roadmap'});
  var ci=seq.map(function(s){return s.k;}).indexOf(cur);
  var check='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l4.5 4.5L19 7"/></svg>';
  var flag='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg>';
  var out='';
  seq.forEach(function(s,i){
    var last=i===seq.length-1;
    var st=i<ci?'done':(i===ci?'cur':'todo');
    var inner = last?flag:(i<ci?check:(i+1));
    out+='<span class="pstep '+st+(last?' goal':'')+'" data-go="'+(i+1)+'" role="button" tabindex="0"><span class="pnode">'+inner+'</span>'+
      '<span class="plabel">'+s.l+'</span></span>';
    if(!last) out+='<span class="pline'+(i<ci?' on':'')+'"></span>';
  });
  return '<div class="stepper'+(dark?' on-dark':'')+'">'+out+'</div>';
}

function cap(s){return s? s.charAt(0).toUpperCase()+s.slice(1) : s;}

}

function validEmail(e){return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);}

async function enviar(form){
  var msg=document.getElementById('formMsg');
  var nombre=form.nombre.value.trim(), email=form.email.value.trim(), empresa='';
  ['f-nombre','f-email'].forEach(function(id){var el=document.getElementById(id); if(el) el.style.borderColor='';});
  function bad(id,txt){ msg.innerHTML='<div class="msg err">'+txt+'</div>'; var el=document.getElementById(id); if(el){ el.style.borderColor='var(--terra)'; el.focus(); } }
  if(!nombre){ bad('f-nombre','Escribe tu nombre y apellido.'); return; }
  if(!validEmail(email)){ bad('f-email','El correo no es válido: debe incluir una @ y un dominio, por ejemplo nombre@empresa.cl'); return; }

  var t=tema(), s=stack(), nia=nivelIA(), ntm=nivelTema(), cr=cursoRecomendado();
  var nivelTemaTxt=(temaUsaNivelTema()&&ntm)?ntm.nombre:'—';
  var payload={
    nombre:nombre, email:email, empresa:empresa,
    tema:t.titulo, stack:s.nombre, nivelIA:nia.nombre, nivelTema:nivelTemaTxt,
    curso:cr.titulo, regalosTexto:cr.titulo,
    fecha:new Date().toISOString(), fechaLocal:new Date().toLocaleString('es-CL')
  };

  // Antibot: si el campo oculto viene lleno, es un robot — simulamos éxito y salimos.
  if(form.website && form.website.value){ state.enviado=true; render(); return; }

  var btn=document.getElementById('submitBtn');
  btn.disabled=true; btn.textContent='Enviando…';

  // 1) Dentro del artifact de Montblanc: se registra con la capability db.
  var db=null;
  try{ db = window.claude && claude.use ? await claude.use('db') : null; }catch(e){ db=null; }
  if(db){
    try{ await db.collection('solicitudes').add(payload); state.enviado=true; render(); }
    catch(e){ btn.disabled=false; btn.textContent='Solicitar mi curso';
      msg.innerHTML='<div class="msg err">No pudimos registrar tu solicitud ('+esc(e&&e.code?e.code:'error')+'). Intenta de nuevo o contáctanos.</div>'; }
    return;
  }

  // 2) Página propia (clientes externos): se registra en Supabase.
  var SUPA_URL=(window.SUPABASE_URL||''), SUPA_KEY=(window.SUPABASE_ANON_KEY||'');
  if(!SUPA_URL || /__/.test(SUPA_URL) || !SUPA_KEY || /__/.test(SUPA_KEY)){
    btn.disabled=false; btn.textContent='Solicitar mi curso';
    msg.innerHTML='<div class="msg err">El registro aún no está configurado. Avísale a Montblanc.</div>'; return;
  }
  var row={ nombre:nombre, email:email, empresa:empresa,
    tema:t.titulo, herramienta:s.nombre, nivel_ia:nia.nombre, nivel_tema:nivelTemaTxt,
    curso:cr.titulo, url_curso:cr.url||'' };
  try{
    var resp=await fetch(SUPA_URL.replace(/\/$/,'')+'/rest/v1/solicitudes',{
      method:'POST',
      headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},
      body:JSON.stringify(row)
    });
    if(!resp.ok) throw new Error('HTTP '+resp.status);
    state.enviado=true; render();
  }catch(e){
    btn.disabled=false; btn.textContent='Solicitar mi curso';
    msg.innerHTML='<div class="msg err">No pudimos registrar tu solicitud. Revisa tu conexión e intenta de nuevo.</div>';
  }
}

function bind(){
  // navegación por data-go
  Array.prototype.forEach.call(stage.querySelectorAll('[data-go]'), function(b){
    b.addEventListener('click', function(){ goto(parseInt(b.getAttribute('data-go'),10)); });
  });
  // opciones (tema/stack/nivel)
  Array.prototype.forEach.call(stage.querySelectorAll('.opt'), function(b){
    b.addEventListener('click', function(){
      var kind=b.getAttribute('data-kind'), id=b.getAttribute('data-id');
      if(kind==='tema'){ state.tema=id; var pf=STACK_FIT[id]||[]; if(state.stack && pf.indexOf(state.stack)<0) state.stack=null; }
      else if(kind==='stack') state.stack=id;
      else if(kind==='nivelIA') state.nivelIA=id;
      else state.nivelTema=id;
      // Nivel IA: en Investigación saltamos el nivel del tema y vamos directo al Roadmap.
      var next = kind==='tema'?2 : kind==='stack'?3 : kind==='nivelIA'?(temaUsaNivelTema()?4:5) : 5;
      goto(next);
    });
  });
  // descargar roadmap
  var dl=document.getElementById('downloadBtn');
  if(dl) dl.addEventListener('click', descargarRoadmap);
  // selección de tema (orbital de portada + tarjetas de la pantalla navy)
  Array.prototype.forEach.call(stage.querySelectorAll('[data-pick-tema]'), function(b){
    b.addEventListener('click', function(){
      var id=b.getAttribute('data-pick-tema');
      state.tema=id; var pf=STACK_FIT[id]||[]; if(state.stack && pf.indexOf(state.stack)<0) state.stack=null;
      goto(2);
    });
  });
  // tema al azar
  var rnd=document.getElementById('randomBtn');
  if(rnd) rnd.addEventListener('click', function(){
    var t=TEMAS[Math.floor(Math.random()*TEMAS.length)];
    state.tema=t.id; var pf=STACK_FIT[t.id]||[]; if(state.stack && pf.indexOf(state.stack)<0) state.stack=null;
    goto(2);
  });
  // copiar prompt
  var copyBtn=document.getElementById('copyBtn');
  if(copyBtn) copyBtn.addEventListener('click', function(){
    var raw=tema().prompt;
    function done(){copyBtn.classList.add('done');copyBtn.querySelector('span').textContent='¡Copiado!';
      setTimeout(function(){copyBtn.classList.remove('done');copyBtn.querySelector('span').textContent='Copiar prompt';},1800);}
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(raw).then(done).catch(selectFallback);}
    else selectFallback();
    function selectFallback(){var r=document.createRange();r.selectNodeContents(document.getElementById('promptTxt'));
      var sel=window.getSelection();sel.removeAllRanges();sel.addRange(r);done();}
  });
  // formulario
  var form=document.getElementById('claimForm');
  if(form){
    form.addEventListener('submit', function(ev){ ev.preventDefault(); enviar(form); });
    var sbtn=document.getElementById('submitBtn');
    function chkReady(){ var ok=form.nombre.value.trim() && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(form.email.value.trim()); if(sbtn) sbtn.classList.toggle('ready', !!ok); }
    form.nombre.addEventListener('input', chkReady); form.email.addEventListener('input', chkReady); chkReady();
  }
}

function goto(step){
  // guardas: no saltar a preguntas posteriores sin respuesta previa
  if(step>=2 && !state.tema) step=1;
  if(step>=3 && !state.stack) step=2;
  if(step>=4 && !state.nivelIA) step=3;
  if(step===4 && !temaUsaNivelTema()) step=5;              // Investigación no usa nivel del tema
  if(step>=5 && temaUsaNivelTema() && !state.nivelTema) step=4;
  if(step===0){ state.tema=state.stack=state.nivelIA=state.nivelTema=null; state.enviado=false; }
  state.step=step; render();
}

/* Panel privado del dueño (Montblanc) */
(function(){
  var adminBtn=document.getElementById('adminBtn'), overlay=document.getElementById('ownerPanel');
  var body=document.getElementById('panelBody'), closeBtn=document.getElementById('panelClose');
  function close(){ overlay.classList.remove('open'); }
  closeBtn.addEventListener('click', close);
  overlay.addEventListener('click', function(e){ if(e.target===overlay) close(); });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') close(); });

  (async function(){
    try{
      var user = window.claude && claude.use ? await claude.use('user') : null;
      if(user && user.isOwner && user.isOwner()) adminBtn.hidden=false;
    }catch(e){}
  })();

  adminBtn.addEventListener('click', async function(){
    overlay.classList.add('open');
    body.innerHTML='<p style="color:var(--muted)">Cargando…</p>';
    var db=null;
    try{ db = window.claude && claude.use ? await claude.use('db') : null; }catch(e){ db=null; }
    if(!db){ body.innerHTML='<p style="color:var(--muted)">No se pudo cargar el registro en esta vista.</p>'; return; }
    try{
      var snap = await db.collection('solicitudes').get();
      var docs = snap.docs.map(function(d){ return d.data(); })
        .sort(function(a,b){ return String(b.fecha||'').localeCompare(String(a.fecha||'')); });
      if(!docs.length){ body.innerHTML='<p style="color:var(--muted)">Aún no hay solicitudes.</p>'; return; }
      var html='<p class="count-line">'+docs.length+' solicitud'+(docs.length===1?'':'es')+'</p>';
      html += docs.map(function(s){
        var meta=['tema','stack','nivelIA','nivelTema','nivel'].map(function(k){ return s[k]?'<span class="mtag">'+esc(s[k])+'</span>':''; }).join('');
        return '<div class="sol"><div class="top"><span class="nm">'+esc(s.nombre||'—')+' · '+esc(s.empresa||'—')+
          '</span><span class="dt">'+esc(s.fechaLocal||s.fecha||'')+'</span></div>'+
          '<div class="em">'+esc(s.email||'')+'</div>'+
          '<div class="meta">'+meta+'</div>'+
          '<div class="reg">Curso solicitado: <b>'+esc(s.curso||s.regalosTexto||'—')+'</b></div></div>';
      }).join('');
      body.innerHTML=html;
    }catch(e){
      body.innerHTML='<p style="color:var(--muted)">Error al leer el registro ('+esc(e&&e.code?e.code:'?')+').</p>';
    }
  });
})();
