<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ruta del Saber — Montblanc</title>
<style>
  /* Layout: recorrido guiado en una sola columna centrada (max ~660px);
     barra de marca arriba, progreso, tarjeta de contenido, cierre editorial.
     Paleta alpina/cumbre: tinta pizarra fría, nieve, acento glaciar + ámbar para el regalo. */
  :root{
    --bg:#f3ecdf; --surface:#ffffff; --surface-2:#f8f3ea;
    --ink:#2c3a4f; --muted:#6f7788; --line:#e6ddcd;
    --accent:#284267; --accent-ink:#284267; --accent-soft:rgba(40,66,103,.08);
    --terra:#a8492f; --terra-soft:rgba(168,73,47,.10);
    --navy:#223a5e; --navy-2:#1a2d49; --navy-line:rgba(255,255,255,.16);
    --gift:#a9772f; --gift-ink:#8a5f1f; --gift-soft:rgba(169,119,47,.12);
    --good:#2f7d5c; --shadow:rgba(40,50,70,.13);
    --font-ui:Tahoma,Verdana,Geneva,"Segoe UI",sans-serif;
    --font-display:Tahoma,Verdana,Geneva,"Segoe UI",sans-serif;
  }

  *{box-sizing:border-box}
  body{background:var(--bg);
    background:radial-gradient(130% 120% at 82% -5%, #fcf8f1 0%, #f3ecdf 52%, #ece2d2 100%) fixed;
    color:var(--ink);font-family:var(--font-ui);
    line-height:1.55;-webkit-font-smoothing:antialiased;margin:0;overflow-x:hidden}
  .wrap{max-width:720px;margin:0 auto;padding-inline:20px;padding-block:0}

  /* Marca */
  .topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;
    background:color-mix(in srgb,var(--bg) 88%,transparent);
    backdrop-filter:saturate(1.2) blur(8px);border-bottom:1px solid var(--line)}
  .topbar .wrap{display:flex;align-items:center;gap:10px;height:56px;max-width:none;margin:0;padding-inline:16px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:.14em;
    text-transform:uppercase;font-size:12px;line-height:1;color:var(--ink)}
  .brand svg{display:block}
  .brand .logo{height:32px;width:auto;display:block}
  @media (max-width:560px){ .brand .logo{height:28px} }
  .brand .wm{display:inline-flex;align-items:baseline;gap:7px}
  .brand small{color:var(--muted);font-weight:500;letter-spacing:.06em}
  .topbar .tagline{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
    font-weight:600;padding-left:14px;margin-left:4px;border-left:1px solid var(--line);white-space:nowrap}
  @media (max-width:560px){ .topbar .tagline{display:none} }
  .topbar .spacer{flex:1}
  .ghost{appearance:none;border:1px solid var(--line);background:var(--surface);
    color:var(--muted);font-family:inherit;font-size:12.5px;font-weight:500;
    padding:6px 12px;border-radius:999px;cursor:pointer}
  .ghost:hover{color:var(--ink);border-color:var(--accent)}

  main{padding-block:28px 64px}
  .anim{animation:rise .38s cubic-bezier(.2,.7,.2,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.anim{animation:none}}

  /* Progreso: stepper del proceso completo, termina en Roadmap */
  .stepper{display:flex;align-items:flex-start;gap:0;margin:2px 0 24px;overflow-x:auto;
    padding-bottom:4px;-webkit-overflow-scrolling:touch}
  .pstep{display:flex;flex-direction:column;align-items:center;gap:6px;flex:none;min-width:56px}
  .pnode{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;
    font-weight:700;background:var(--surface);border:2px solid var(--line);color:var(--muted);
    font-variant-numeric:tabular-nums}
  .pnode svg{width:13px;height:13px}
  .pstep.done .pnode{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
  .pstep.cur .pnode{border-color:var(--accent);background:var(--accent);color:#fff}
  .pstep.goal .pnode{border-color:var(--gift);color:var(--gift-ink);background:var(--gift-soft)}
  .pstep.goal.cur .pnode{background:var(--gift);border-color:var(--gift);color:#fff}
  .plabel{font-size:10.5px;letter-spacing:.01em;color:var(--muted);white-space:nowrap}
  .pstep.cur .plabel{color:var(--ink);font-weight:600}
  .pstep.goal .plabel{color:var(--gift-ink);font-weight:600}
  .pval{margin-top:1px;font-size:11px;font-weight:600;color:var(--accent-ink);white-space:nowrap}
  .pline{flex:1;min-width:12px;height:2px;background:var(--line);margin:13px 2px 0}
  .pline.on{background:var(--accent)}

  .eyebrow{text-transform:uppercase;letter-spacing:.16em;font-size:11.5px;font-weight:600;
    color:var(--accent-ink)}
  h1{font-family:var(--font-display);font-weight:500;font-size:clamp(28px,6vw,40px);
    line-height:1.08;letter-spacing:-.01em;text-wrap:balance;margin:.4em 0 .3em}
  .q-title{font-family:var(--font-display);font-weight:500;font-size:clamp(23px,5vw,30px);
    line-height:1.12;text-wrap:balance;margin:.2em 0 .25em}
  .lead{color:var(--muted);font-size:16px;max-width:60ch}
  .q-help{color:var(--muted);font-size:14.5px;margin:.2em 0 20px;max-width:58ch}

  /* Portada: citas de apertura */
  .cover-quote{font-family:var(--font-display);font-size:clamp(20px,4.4vw,27px);
    line-height:1.28;font-style:italic;text-wrap:balance;margin:0}
  .cover-quote .by{display:block;font-style:normal;font-size:14px;letter-spacing:.04em;
    color:var(--accent-ink);margin-top:12px;font-family:var(--font-ui);font-weight:600}
  .quote-rule{height:1px;background:var(--line);margin:22px 0}
  .mini-quotes{display:grid;gap:14px}
  .mini-quotes .mq{font-size:14.5px;color:var(--muted);padding-left:14px;
    border-left:2px solid var(--line)}
  .mini-quotes .mq b{color:var(--ink);font-weight:600}
  .eqq{font-family:var(--font-display);font-style:italic;font-size:clamp(17px,3.3vw,20px);
    line-height:1.3;text-wrap:balance;margin:18px 0}
  .eqq .by{display:block;font-style:normal;font-family:var(--font-ui);font-weight:600;
    font-size:13px;letter-spacing:.04em;color:var(--accent-ink);margin-top:9px}
  .how{display:flex;gap:14px;flex-wrap:wrap;margin:24px 0 8px}
  .how .pill{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted);
    background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 14px}
  .how .n{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;
    background:var(--accent-soft);color:var(--accent-ink);font-size:12px;font-weight:600}

  /* ===== Portada editorial (estilo colección) ===== */
  .hero{display:grid;grid-template-columns:1.1fr .95fr .9fr;gap:clamp(20px,2.4vw,38px);align-items:start;
    text-align:left;padding-top:clamp(8px,3vh,30px);margin-bottom:6px;
    /* Rompe el ancho del contenedor (720px) para dar aire a las 3 columnas, centrado en el viewport */
    width:min(1120px,100vw - 32px);position:relative;left:50%;margin-left:calc(min(1120px,100vw - 32px) / -2)}
  .hero .eyebrow{color:var(--terra)}
  .hero h1{font-weight:700;font-size:clamp(26px,3vw,42px);line-height:1.08;letter-spacing:-.015em;margin:.25em 0 .4em;max-width:16ch}
  .hero .lead{font-size:clamp(15px,1.5vw,17px);max-width:46ch}
  @media (max-width:1040px){
    .hero{grid-template-columns:1fr 1fr;align-items:start}
    .hero .hero-copy{grid-column:1 / -1}
  }
  @media (max-width:640px){
    .hero{grid-template-columns:1fr;text-align:center;gap:24px;padding-top:6px;
      width:auto;left:auto;margin-left:0}
    .hero .hero-copy{grid-column:auto}
    .hero h1{margin-left:auto;margin-right:auto}
    .hero .lead{margin-left:auto;margin-right:auto}
  }
  /* Portada: columna de citas (3ª columna) */
  .quotes-col{display:flex;flex-direction:column;gap:12px}
  .quotes-col .qc-k{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:2px 0 0}
  .quotes-col .qcard{margin:0;font-size:13.5px;line-height:1.4;padding:15px 16px}
  .quotes-col .qcard .by{font-size:11.5px;margin-top:9px}
  .explore-hint{text-align:center;margin:18px 0 2px;color:var(--muted);font-size:11px;letter-spacing:.18em;
    text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:12px}
  .explore-hint::before,.explore-hint::after{content:"";height:1px;width:46px;background:var(--line)}
  .ctx-chip{display:inline-flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);
    border-radius:999px;padding:8px 15px;font-size:13px;color:var(--muted);margin:24px 0 2px;
    box-shadow:0 8px 22px -16px var(--shadow)}
  .ctx-chip .dot{width:8px;height:8px;border-radius:50%;background:var(--terra);flex:none}
  .ctx-chip b{color:var(--ink)}
  .hero-cta{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-top:22px}
  .btn.lg{font-size:16.5px;padding:16px 26px;border-radius:14px}
  .link-btn{appearance:none;background:none;border:0;cursor:pointer;font-family:inherit;font-weight:600;
    font-size:15px;color:var(--accent-ink);display:inline-flex;align-items:center;gap:8px;padding:6px 2px}
  .link-btn:hover{color:var(--terra)}

  /* Rastreador "Tu recorrido" */
  .recorrido{display:inline-flex;align-items:center;gap:13px;background:var(--navy);color:#fff;
    border-radius:14px;padding:10px 17px 10px 12px;margin-top:30px}
  .recorrido .steps{display:flex;gap:6px}
  .recorrido .s{width:27px;height:27px;border-radius:8px;display:grid;place-items:center;font-size:11px;
    font-weight:700;background:rgba(255,255,255,.12);color:rgba(255,255,255,.72);font-variant-numeric:tabular-nums}
  .recorrido .s.on{background:#fff;color:var(--navy)}
  .recorrido .lab{font-size:12.5px;line-height:1.25}
  .recorrido .lab b{display:block;font-size:13px}
  .recorrido .lab span{color:rgba(255,255,255,.7)}

  /* Mapa orbital (portada, desktop) */
  .orbit{position:relative;width:100%;max-width:560px;aspect-ratio:1/1;margin:0 auto}
  .orbit .ring{position:absolute;border:1px solid var(--line);border-radius:50%;inset:4%;opacity:.95}
  .orbit .ring.r2{inset:17%}
  .orbit .ring.r3{inset:29%}
  .orbit .hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:42%;height:42%;
    border:0;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;text-align:center;
    padding:10px;box-shadow:0 26px 58px -24px rgba(34,58,94,.6),0 0 0 10px rgba(34,58,94,.05);
    font-family:inherit;cursor:pointer;transition:transform .16s,box-shadow .16s,background .16s}
  .orbit .hub.hub-cta:hover{background:var(--navy-2);transform:translate(-50%,-50%) scale(1.05);
    box-shadow:0 32px 68px -22px rgba(34,58,94,.72),0 0 0 13px rgba(34,58,94,.09)}
  .orbit .hub .k{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;opacity:.72}
  .orbit .hub .t{font-size:clamp(18px,2.7vw,25px);font-weight:700;line-height:1.08;margin-top:5px}
  .orbit .hub .hub-go{display:block;margin-top:6px;font-size:19px;opacity:.9}
  .onode{position:absolute;width:40%;max-width:196px;background:var(--surface);border:1px solid var(--line);
    border-radius:16px;padding:14px 16px;box-shadow:0 16px 36px -20px var(--shadow);
    text-align:left;color:inherit}
  .onode .num{display:block;font-size:11px;letter-spacing:.14em;color:var(--muted);font-weight:700}
  .onode .lbl{display:block;font-size:15.5px;font-weight:700;line-height:1.18;margin-top:5px;color:var(--ink)}
  .onode.p1{left:0;top:4%} .onode.p2{right:0;top:15%}
  .onode.p3{right:0;bottom:7%} .onode.p4{left:0;bottom:14%}
  @media (max-width:720px){ .hero-art{display:none} }

  /* ===== Pantalla navy de temas ("territorios") ===== */
  .navy-screen{background:linear-gradient(158deg,var(--navy),var(--navy-2));color:#fff;border-radius:24px;
    padding:clamp(20px,3.6vw,38px);margin-top:2px;position:relative;overflow:hidden}
  .navy-screen::after{content:"";position:absolute;width:360px;height:360px;right:-80px;top:-120px;
    background:radial-gradient(circle,rgba(231,201,189,.14),transparent 70%);pointer-events:none}
  .navy-screen .eyebrow{color:#e7c9bd}
  .navy-screen h2.q-title{color:#fff}
  .navy-screen .sub{color:rgba(255,255,255,.72);font-size:14.5px;max-width:58ch}
  .terr-hub{max-width:60ch;position:relative;z-index:1}
  .terr-hub .k{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.5);font-weight:600}
  .terr-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px;position:relative;z-index:1}
  @media (max-width:620px){ .terr-grid{grid-template-columns:1fr} }
  .terr{display:block;text-align:left;font-family:inherit;color:#fff;cursor:pointer;
    background:rgba(255,255,255,.055);border:1px solid var(--navy-line);border-radius:16px;padding:18px 18px;
    transition:background .15s,border-color .15s,transform .1s}
  .terr:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.42);transform:translateY(-2px)}
  .terr[aria-current="true"]{border-color:#e7c9bd;background:rgba(231,201,189,.13)}
  .terr .num{font-size:11px;letter-spacing:.12em;color:rgba(255,255,255,.55);font-weight:700}
  .terr .tt{display:block;font-size:19px;font-weight:700;margin:6px 0 5px;line-height:1.12}
  .terr .dd{display:block;font-size:13.5px;color:rgba(255,255,255,.72);line-height:1.42}
  .terr .go{font-size:12.5px;color:#e7c9bd;font-weight:600;margin-top:12px;display:inline-flex;gap:6px}
  .back.on-dark{color:rgba(255,255,255,.75);position:relative;z-index:1}
  .back.on-dark:hover{color:#fff}

  /* Stepper sobre fondo navy */
  .stepper.on-dark{position:relative;z-index:1}
  .stepper.on-dark .pnode{background:rgba(255,255,255,.08);border-color:var(--navy-line);color:rgba(255,255,255,.7)}
  .stepper.on-dark .pstep.done .pnode{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.4);color:#fff}
  .stepper.on-dark .pstep.cur .pnode{background:#fff;border-color:#fff;color:var(--navy)}
  .stepper.on-dark .pstep.goal .pnode{background:var(--gift);border-color:var(--gift);color:#fff}
  .stepper.on-dark .plabel{color:rgba(255,255,255,.6)}
  .stepper.on-dark .pstep.cur .plabel{color:#fff}
  .stepper.on-dark .pstep.goal .plabel{color:#e6c688}
  .stepper.on-dark .pval{color:rgba(255,255,255,.82)}
  .stepper.on-dark .pline{background:var(--navy-line)} .stepper.on-dark .pline.on{background:rgba(255,255,255,.75)}

  /* Banda de citas de apertura */
  .quotes-band{margin:26px 0 8px;border-top:1px solid var(--line);padding-top:24px}
  .qb-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:16px}
  @media (max-width:760px){ .qb-grid{grid-template-columns:1fr} }
  .qcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;margin:0;
    font-size:15px;line-height:1.42;font-style:italic;color:var(--ink);box-shadow:0 12px 32px -24px var(--shadow)}
  .qcard .by{display:block;font-style:normal;font-weight:700;font-size:12.5px;letter-spacing:.04em;
    color:var(--accent-ink);margin-top:12px}

  /* Guía "cómo funciona" (panel derecho de la portada, donde iba el orbe) */
  .guia{background:var(--surface);border:1px solid var(--line);border-radius:20px;
    padding:26px 26px 24px;box-shadow:0 26px 64px -36px var(--shadow)}
  .guia .g-k{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--terra);font-weight:700}
  .guia .g-ttl{font-family:var(--font-display);font-weight:600;font-size:clamp(19px,2vw,22px);
    line-height:1.18;letter-spacing:-.01em;color:var(--ink);margin:6px 0 20px}
  .gsteps{display:block}
  .gstep{display:flex;gap:15px;align-items:flex-start;padding-bottom:18px;position:relative}
  .gsteps .gstep:not(:last-child)::before{content:"";position:absolute;left:17px;top:38px;bottom:0;
    width:2px;background:var(--line)}
  .gstep .gn{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;
    font-weight:700;font-size:16px;background:var(--navy);color:#fff;position:relative;z-index:1}
  .gstep.gift .gn{background:var(--gift)}
  .gstep .gtx{min-width:0}
  .gstep .gtx b{display:block;font-size:16px;color:var(--ink);margin-bottom:3px;line-height:1.25}
  .gstep .gtx span{display:block;font-size:14px;color:var(--muted);line-height:1.5}
  .g-cta{margin-top:6px}
  .g-cta .btn{width:100%;justify-content:center;font-size:16px;padding:15px 20px}

  /* Botones */
  .btn{appearance:none;-webkit-appearance:none;border:0;cursor:pointer;font-family:inherit;font-weight:600;
    font-size:15.5px;padding:13px 22px;border-radius:12px;background:#284267;background:var(--accent);color:#fff;
    display:inline-flex;align-items:center;gap:9px;transition:transform .08s ease,filter .15s}
  .btn:hover{filter:brightness(1.06)} .btn:active{transform:translateY(1px)}
  .btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
  .btn.full{width:100%;justify-content:center}
  .back{display:inline-flex;align-items:center;gap:7px;background:none;border:0;cursor:pointer;
    color:var(--muted);font-family:inherit;font-size:14px;font-weight:500;padding:8px 0;margin-bottom:6px}
  .back:hover{color:var(--accent)}
  .row-actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:8px}

  /* Tarjetas de opción (tema / stack / nivel) */
  .options{display:grid;gap:12px}
  .opt{display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;
    background:var(--surface);border:1.5px solid var(--line);border-radius:14px;
    padding:16px 17px;cursor:pointer;font-family:inherit;color:inherit;
    transition:border-color .15s,box-shadow .15s,transform .08s}
  .opt:hover{border-color:var(--accent);box-shadow:0 6px 20px -12px var(--shadow)}
  .opt:active{transform:translateY(1px)}
  .opt[aria-current="true"]{border-color:var(--accent);background:var(--accent-soft)}
  .opt .ic{flex:none;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;
    background:var(--accent-soft);color:var(--accent-ink)}
  .opt .ic svg{width:22px;height:22px}
  .opt .ttl{font-weight:600;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .opt .tag{font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--muted);
    border:1px solid var(--line);border-radius:6px;padding:1px 7px}
  .opt .d{color:var(--muted);font-size:14px;margin-top:3px}
  .opt .chev{margin-left:auto;align-self:center;color:var(--line)}
  .opt:hover .chev{color:var(--accent)}
  .opt .ic.num{font-weight:700;color:var(--accent-ink);font-size:15px;font-family:var(--font-display);
    font-variant-numeric:tabular-nums}

  /* Pregunta editorial de dos paneles (rompe el "formulario vertical") */
  .ask-wrap{width:min(1060px, calc(100vw - 48px));
    margin-inline:calc(50% - min(530px, (100vw - 48px)/2)) auto}
  .ask{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(28px,4vw,60px);
    align-items:start;margin-top:8px}
  .ask-copy{position:relative}
  .ask-copy .back{margin-bottom:10px}
  .ask-num{font-family:var(--font-display);font-weight:700;font-size:clamp(50px,7vw,88px);
    line-height:.85;letter-spacing:-.03em;color:var(--accent);opacity:.13}
  .ask-eyebrow{color:var(--terra);text-transform:uppercase;letter-spacing:.16em;font-size:12px;
    font-weight:700;margin:12px 0 7px}
  .ask-title{font-family:var(--font-display);font-weight:500;font-size:clamp(25px,3.3vw,40px);
    line-height:1.08;letter-spacing:-.01em;margin:0 0 .4em;color:var(--ink)}
  .ask-help{color:var(--muted);font-size:14.5px;line-height:1.55;max-width:40ch}
  .ask-options{display:grid;gap:12px;align-content:start}
  @media(max-width:760px){
    .ask-wrap{width:auto;margin-inline:0}
    .ask{grid-template-columns:1fr;gap:16px}
    .ask-num{display:none}
  }

  /* Roadmap como "dossier" de dos columnas */
  .road-wrap{width:min(1120px, calc(100vw - 48px));
    margin-inline:calc(50% - min(560px, (100vw - 48px)/2)) auto}
  .road-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px 28px;flex-wrap:wrap;margin:8px 0 2px}
  .road-head-main{min-width:280px;flex:1}
  .road-title{font-family:var(--font-display);font-weight:500;font-size:clamp(28px,4vw,46px);
    line-height:1.03;letter-spacing:-.01em;margin:.1em 0 .22em;color:var(--ink)}
  .road-sub{color:var(--muted);font-size:14.5px;max-width:52ch;margin:0 0 10px}
  .road-recap{color:var(--ink);font-size:16px;line-height:1.6;max-width:62ch;margin:6px 0 6px}
  .road-recap b{color:var(--navy);font-weight:600}
  .road-recap-edit{color:var(--muted);font-size:13px;margin:0 0 4px}
  .road-head-side{flex:none}
  .road-grid{display:grid;grid-template-columns:minmax(0,1.32fr) minmax(0,1fr);gap:22px;align-items:start;margin-top:8px}
  .road-main{min-width:0}
  .road-side{position:sticky;top:16px;display:grid;gap:16px;min-width:0}
  .road-main > .block:first-child,.road-side > .block:first-child{margin-top:0}
  @media(max-width:900px){
    .road-wrap{width:auto;margin-inline:0}
    .road-grid{grid-template-columns:1fr;gap:4px}
    .road-side{position:static}
  }

  /* Resultado */
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px}
  .chip{display:inline-flex;align-items:center;gap:7px;background:var(--surface);
    border:1px solid var(--line);border-radius:999px;padding:6px 8px 6px 13px;font-size:13px;
    color:var(--ink);cursor:pointer;font-family:inherit}
  .chip:hover{border-color:var(--accent)}
  .chip .k{color:var(--muted);font-size:11px;letter-spacing:.04em;text-transform:uppercase}
  .chip .edit{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;
    background:var(--surface-2);color:var(--muted);font-size:11px}

  .block{background:var(--surface);border:1px solid var(--line);border-radius:16px;
    padding:20px;margin-top:16px}
  .block > .head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
  .block .kicker{text-transform:uppercase;letter-spacing:.14em;font-size:11px;font-weight:700;
    color:var(--accent-ink)}
  .block h3{font-family:var(--font-display);font-weight:500;font-size:21px;margin:.1em 0 .3em;line-height:1.15}
  .block p.sub{color:var(--muted);font-size:14.5px;margin:.1em 0 0}

  .prompt-card{background:var(--surface-2);border:1px dashed var(--line);border-radius:12px;
    padding:15px 16px;margin-top:12px;font-size:14.5px;line-height:1.5}
  .prompt-card .txt{white-space:pre-wrap}
  .prompt-card .txt .fill{color:var(--accent-ink);font-weight:600}
  .ideas{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:9px}
  .ideas li{position:relative;padding-left:24px;font-size:14.5px;color:var(--ink)}
  .ideas li::before{content:"→";position:absolute;left:3px;top:0;color:var(--accent-ink);font-weight:700}
  .note{background:var(--accent-soft);border-left:3px solid var(--accent);border-radius:10px;
    padding:12px 14px;margin-top:14px;font-size:13.5px;color:var(--ink)}
  .note b{color:var(--accent-ink)}
  .note.warn{background:var(--gift-soft);border-left-color:var(--gift)}
  .note.warn b{color:var(--gift-ink)}
  .copy{margin-top:12px;appearance:none;border:1px solid var(--line);background:var(--surface);
    color:var(--ink);font-family:inherit;font-size:13.5px;font-weight:600;padding:9px 15px;
    border-radius:9px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
  .copy:hover{border-color:var(--accent);color:var(--accent-ink)}
  .copy.done{color:var(--good);border-color:var(--good)}

  /* Timeline del plan */
  .timeline{margin-top:14px;display:grid;gap:0}
  .stage{display:grid;grid-template-columns:28px 1fr;gap:14px;padding-bottom:18px;position:relative}
  .stage:not(:last-child)::before{content:"";position:absolute;left:13px;top:26px;bottom:-2px;
    width:2px;background:var(--line)}
  .stage .dot{width:28px;height:28px;border-radius:50%;background:var(--surface);
    border:2px solid var(--line);display:grid;place-items:center;font-size:12.5px;font-weight:700;
    color:var(--muted);z-index:1;font-variant-numeric:tabular-nums}
  .stage.here .dot{border-color:var(--accent);background:var(--accent);color:#fff}
  .stage.done{opacity:.55}
  .stage .st-ttl{font-weight:600;font-size:15.5px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .stage .badge{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    padding:2px 8px;border-radius:6px;background:var(--accent);color:#fff}
  .stage .badge.soft{background:var(--surface-2);color:var(--muted)}
  .stage .st-d{color:var(--muted);font-size:14px;margin-top:2px}
  .stage .time{font-size:12.5px;color:var(--accent-ink);font-weight:600;margin-top:5px}
  .time-note{margin-top:8px;font-size:13.5px;color:var(--muted);background:var(--surface-2);
    border-radius:10px;padding:11px 13px}

  /* Regalos */
  .gift-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .counter{font-size:13px;font-weight:600;color:var(--gift-ink);background:var(--gift-soft);
    border-radius:999px;padding:4px 12px}
  .gifts{display:grid;gap:11px;margin-top:14px}
  .gift{display:flex;gap:13px;align-items:flex-start;border:1.5px solid var(--line);
    border-radius:13px;padding:14px 15px;cursor:pointer;background:var(--surface);
    transition:border-color .15s,background .15s}
  .gift:hover{border-color:var(--gift)}
  .gift.on{border-color:var(--gift);background:var(--gift-soft)}
  .gift.dim{opacity:.5}
  .gift .box{flex:none;width:22px;height:22px;border-radius:6px;border:2px solid var(--line);
    display:grid;place-items:center;margin-top:1px;background:var(--surface);color:transparent}
  .gift.on .box{background:var(--gift);border-color:var(--gift);color:#fff}
  .gift .g-ttl{font-weight:600;font-size:15px}
  .gift .g-tag{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
    color:var(--gift-ink);background:var(--gift-soft);border-radius:5px;padding:1px 7px;margin-left:8px}
  .gift .g-d{color:var(--muted);font-size:13.5px;margin-top:3px}
  .gift .g-link{font-size:12.5px;color:var(--accent-ink);text-decoration:none;font-weight:600;margin-top:5px;display:inline-block}
  .gift .g-link:hover{text-decoration:underline}

  /* Curso recomendado (único, lo elige Montblanc según el nivel) */
  .course{display:flex;gap:14px;align-items:flex-start;border:1.5px solid var(--gift);
    background:var(--gift-soft);border-radius:14px;padding:16px 17px;margin-top:14px}
  .course .cic{flex:none;width:42px;height:42px;border-radius:11px;display:grid;place-items:center;
    background:var(--surface);color:var(--gift-ink);border:1px solid var(--gift)}
  .course .cic svg{width:22px;height:22px}
  .course .c-tag{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
    color:var(--gift-ink)}
  .course .c-ttl{font-weight:600;font-size:16px;margin:2px 0 2px}
  .course .c-d{color:var(--muted);font-size:13.5px}
  .course .c-why{font-size:13px;color:var(--gift-ink);margin-top:7px}
  .course .c-link{font-size:12.5px;color:var(--accent-ink);text-decoration:none;font-weight:600;
    margin-top:6px;display:inline-block}
  .course .c-link:hover{text-decoration:underline}

  /* Ruta de cursos (Fundamentos → Aplicado → Avanzado) */
  .course-path{display:grid;gap:10px;margin:14px 0 6px}
  .cstep{display:flex;gap:13px;align-items:flex-start;border:1.5px solid var(--line);border-radius:13px;
    padding:13px 15px;background:var(--surface);text-decoration:none;color:inherit;
    transition:border-color .15s,box-shadow .15s,transform .1s}
  .cstep:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:0 10px 24px -16px var(--shadow)}
  .cstep.gift{border-color:var(--gift);background:var(--gift-soft)}
  .cstep.done{opacity:.62}
  .cstep-dot{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;
    font-weight:700;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);
    font-variant-numeric:tabular-nums}
  .cstep.gift .cstep-dot{background:var(--gift);border-color:var(--gift);color:#fff}
  .cstep-top{font-size:10.5px;letter-spacing:.03em;color:var(--muted);text-transform:uppercase;font-weight:700;
    display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .cstep-badge{font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);
    border:1px solid var(--line);border-radius:5px;padding:1px 6px}
  .cstep-badge.gift{color:#fff;background:var(--gift);border-color:var(--gift)}
  .cstep-t{display:block;font-weight:700;font-size:14.5px;margin:3px 0 2px;line-height:1.2;color:var(--ink)}
  .cstep-prov{display:block;font-size:12.5px;color:var(--accent-ink);font-weight:600}
  .cstep:hover .cstep-prov{color:var(--terra)}

  /* Roadmap v2: cursos en horizontal, ejemplos con preview, botón que brilla */
  .course-rail{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:14px 0 4px}
  @media(max-width:620px){.course-rail{grid-template-columns:1fr}}
  .rail-step{display:flex;flex-direction:column;gap:3px;border:1.5px solid var(--line);border-radius:14px;
    padding:14px;text-decoration:none;color:inherit;background:var(--surface);transition:transform .12s,box-shadow .12s}
  .rail-step:hover{transform:translateY(-2px);box-shadow:0 12px 26px -16px var(--shadow)}
  .rail-step.dim{opacity:.62;background:var(--surface-2)}
  .rail-step.gift{border-color:var(--navy);background:linear-gradient(170deg,rgba(40,66,103,.10),rgba(40,66,103,.03));box-shadow:0 14px 30px -18px rgba(34,58,94,.5)}
  .rail-top{display:flex;align-items:center;justify-content:space-between}
  .rail-n{width:24px;height:24px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted)}
  .rail-step.gift .rail-n{background:var(--navy);color:#fff}
  .rail-badge{font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:2px 7px}
  .rail-step.gift .rail-badge{background:var(--navy);color:#fff;border-color:var(--navy)}
  .rail-nivel{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-top:8px}
  .rail-t{font-weight:700;font-size:14.5px;line-height:1.22;color:var(--ink)}
  .rail-meta{font-size:12px;color:var(--muted)}
  .rail-why{font-size:12.5px;line-height:1.4;color:var(--ink);margin-top:7px}
  .rail-step.dim .rail-why{color:var(--muted)}
  .rail-go{font-size:12.5px;font-weight:600;color:var(--accent-ink);margin-top:auto;padding-top:8px}
  .rail-step.gift .rail-go{color:var(--navy)}
  /* Roadmap por etapas (lo que vas a poder hacer) */
  .etapas{display:flex;flex-direction:column;gap:10px;margin:14px 0 4px}
  .etapa{display:block;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
  .etapa.done{opacity:.72;background:var(--surface-2)}
  .etapa.here{border-color:var(--navy);background:linear-gradient(170deg,rgba(40,66,103,.10),rgba(40,66,103,.03));box-shadow:0 10px 24px -18px rgba(34,58,94,.5)}
  .et-sum{display:flex;gap:12px;align-items:center;padding:12px 14px;cursor:pointer;list-style:none;user-select:none}
  .et-sum::-webkit-details-marker{display:none}
  .et-sum::marker{content:""}
  .et-n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-size:12.5px;font-weight:700;color:var(--muted)}
  .etapa.done .et-n{background:var(--accent-soft);color:var(--accent-ink)}
  .etapa.here .et-n{background:var(--navy);color:#fff}
  .et-ttl{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:center;gap:7px}
  .et-ttl>b{font-size:14.5px;color:var(--ink)}
  .et-caret{flex:none;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .2s;margin-right:3px}
  .etapa[open] .et-caret{transform:rotate(-135deg)}
  .et-body{display:flex;flex-direction:column;gap:3px;padding:0 14px 13px 52px}
  .et-tag{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#fff;background:var(--navy);border-radius:6px;padding:2px 7px}
  .et-tag.base{background:transparent;color:var(--muted);border:1px solid var(--line)}
  .et-d{font-size:13px;color:var(--muted);line-height:1.45}
  .et-h{font-size:12px;color:var(--accent-ink);font-weight:600;margin-top:2px}
  .et-course{display:inline-flex;align-items:center;gap:6px;width:fit-content;max-width:100%;font-size:11.5px;font-weight:600;
    color:var(--accent-ink);text-decoration:none;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:4px 9px;margin-top:7px;line-height:1.3}
  .et-course:hover{border-color:var(--accent)}
  .et-course.gift{color:#fff;background:var(--navy);border-color:var(--navy)}
  .et-course .ec-rol{font-weight:700;letter-spacing:.02em}
  .et-course .ec-sep{opacity:.5}
  /* Elegir regalo (3 opciones) */
  .gopts{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
  .gopt{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;background:var(--surface);transition:border-color .12s,background .12s}
  .gopt:hover{border-color:var(--accent)}
  .gopt input{position:absolute;opacity:0;width:0;height:0}
  .gopt.on{border-color:var(--navy);background:linear-gradient(170deg,rgba(40,66,103,.09),rgba(40,66,103,.02))}
  .go-ic{flex:none;font-size:18px;line-height:1.2}
  .go-tx{display:flex;flex-direction:column;gap:1px;flex:1}
  .go-tx b{font-size:13.5px;color:var(--ink)}
  .go-tx small{font-size:12px;color:var(--muted);line-height:1.4}
  .go-mark{flex:none;width:18px;height:18px;border-radius:6px;border:2px solid var(--line);margin-top:2px;position:relative}
  .gopt.on .go-mark{border-color:var(--navy);background:var(--navy)}
  .gopt.on .go-mark::after{content:"";position:absolute;left:5px;top:2px;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
  .agenda-alt{font-size:12.5px;color:var(--muted);margin:12px 0 0}
  .agenda-alt a{color:var(--accent-ink);font-weight:600;text-decoration:none}
  .agenda-alt a:hover{text-decoration:underline}
  /* ¿Y después? */
  .siguiente{margin-top:16px}
  .sig-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:14px}
  @media(max-width:620px){.sig-grid{grid-template-columns:1fr}}
  .sig-card{display:flex;flex-direction:column;gap:2px;border:1.5px solid var(--line);border-radius:14px;padding:14px;text-decoration:none;color:inherit;background:var(--surface);transition:transform .12s,box-shadow .12s}
  .sig-card:hover{transform:translateY(-2px);box-shadow:0 12px 26px -16px var(--shadow)}
  .sig-ic{font-size:20px;line-height:1.1}
  .sig-et{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-top:4px}
  .sig-t{font-size:14.5px;line-height:1.2;color:var(--ink)}
  .sig-prov{font-size:12px;color:var(--muted)}
  .sig-d{font-size:12.5px;line-height:1.4;color:var(--ink);margin-top:5px}
  .sig-go{font-size:12.5px;font-weight:600;color:var(--accent-ink);margin-top:auto;padding-top:8px}
  .form-card{border-color:var(--gift)}
  .btn.ready{background:var(--gift);animation:pulseGift 1.6s ease-in-out infinite}
  @keyframes pulseGift{0%{box-shadow:0 0 0 0 rgba(169,119,47,.5)}70%{box-shadow:0 0 0 14px rgba(169,119,47,0)}100%{box-shadow:0 0 0 0 rgba(169,119,47,0)}}
  .examples{margin-top:22px}
  .ex-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:14px}
  @media(max-width:820px){.ex-grid{grid-template-columns:1fr}}
  .ex-card{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--surface);display:flex;flex-direction:column}
  .ex-prev{position:relative;display:block;height:190px;overflow:hidden;border-bottom:1px solid var(--line);background:var(--surface-2)}
  .ex-prev img{width:100%;height:190px;object-fit:cover;object-position:top left;display:block;transition:transform .35s ease}
  .ex-card:hover .ex-prev img{transform:scale(1.04)}
  .ex-ind{position:absolute;top:8px;left:8px;background:rgba(34,58,94,.92);color:#fff;font-size:10px;font-weight:700;letter-spacing:.04em;padding:3px 9px;border-radius:999px}
  .ex-body{padding:14px 15px;display:flex;flex-direction:column;gap:6px;flex:1}
  .ex-t{font-weight:700;font-size:14.5px;color:var(--ink)}
  .ex-d{font-size:12.5px;color:var(--muted);line-height:1.42;flex:1}
  .ex-go{font-size:12.5px;font-weight:700;color:var(--accent-ink);text-decoration:none;margin-top:2px}
  .ex-go:hover{color:var(--terra)}
  .topbar .brand,.topbar .tagline{cursor:pointer}
  .topbar .brand:hover .wm,.topbar .tagline:hover{color:var(--accent-ink)}
  .stepper .pstep{cursor:pointer}
  .stepper .pstep:hover .pnode{border-color:var(--accent)}
  .stepper .pstep:hover .plabel{color:var(--ink)}
  .obj-ejemplos{width:min(1060px, calc(100vw - 48px));margin-inline:calc(50% - min(530px, (100vw - 48px)/2)) auto;margin-top:30px}
  .oe-head{text-align:center;max-width:640px;margin:0 auto}
  .oe-head h3{font-family:var(--font-display);font-weight:500;font-size:clamp(20px,2.4vw,27px);margin:.2em 0 .25em;color:var(--ink)}
  .obj-grp{margin-top:22px}
  .obj-grp-t{display:block;font-weight:700;font-size:12.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--accent-ink);border-bottom:1px solid var(--line);padding-bottom:7px;margin-bottom:12px}
  @media(max-width:760px){.obj-ejemplos{width:auto;margin-inline:0}}

  /* Acciones del roadmap (descargar) */
  .roadmap-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
  .more{margin-top:26px;border-top:1px dashed var(--line);padding-top:18px}
  .more h4{font-family:var(--font-display);font-weight:500;font-size:17px;margin:0 0 4px}
  .more p{color:var(--muted);font-size:13.5px;margin:0}

  /* Casos reales de Montblanc dentro de las ideas */
  .cases{margin-top:16px;border-top:1px dashed var(--line);padding-top:15px}
  .cases-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .mb-badge{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#fff;
    background:var(--navy);border-radius:6px;padding:3px 9px}
  .cases-sub{color:var(--muted);font-size:13px;margin:0}
  .cases-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
  @media (max-width:620px){ .cases-grid{grid-template-columns:1fr} }
  .case{display:flex;flex-direction:column;background:var(--surface-2);border:1px solid var(--line);
    border-radius:12px;padding:13px 14px;text-decoration:none;color:inherit;cursor:pointer;
    transition:border-color .15s,box-shadow .15s,transform .1s}
  .case:hover{border-color:var(--navy);box-shadow:0 10px 24px -16px var(--shadow);transform:translateY(-2px)}
  .case-ind{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--terra);font-weight:700}
  .case-t{display:block;font-weight:700;font-size:13.5px;margin:4px 0 4px;line-height:1.2;color:var(--ink)}
  .case-d{display:block;color:var(--muted);font-size:12.5px;line-height:1.4}
  .case-go{margin-top:auto;padding-top:9px;font-size:11.5px;font-weight:700;color:var(--accent-ink);
    letter-spacing:.02em}
  .case:hover .case-go{color:var(--terra)}

/* Ruta de 3 cursos (Fundamentos según herramienta + Aplicado + Avanzado del tema,
   calzados a la herramienta) y el índice de entrada (regalo). */
function cursoPath(){
  var s=stack(), t=tema();
  var fund = CURSO_FUND[s?s.id:'claude'] || CURSO_FUND.claude;
  var bank = CURSO_TEMA[t?t.id:'sistematizar'] || {};
  var rest = (s && bank[s.id]) || bank._def || [];
  return [fund].concat(rest);
}
/* Índice del curso que REGALAMOS. Parte en el punto de entrada de la ruta, pero si
   ese curso es gratis, movemos el regalo a un curso PAGADO de la misma ruta (así el
   regalo siempre tiene valor): primero buscamos uno pagado más avanzado y, si no hay,
   uno anterior. Si ninguno es pagado, se queda en el de entrada. */
function cursoEntry(){
  var path=cursoPath(), e=entryIndex(), i=e>2?2:e;
  if(path[i] && path[i].pago) return i;                                 // el de entrada ya es pagado
  for(var j=i+1;j<path.length;j++){ if(path[j]&&path[j].pago) return j; } // prefiere uno más avanzado
  for(var k=i-1;k>=0;k--){ if(path[k]&&path[k].pago) return k; }          // si no, uno anterior
  return i;                                                             // ninguno pagado: deja el de entrada
}

function cursoRecomendado(){
  var path=cursoPath(), e0=entryIndex(), start=e0>2?2:e0, i=cursoEntry(), c=path[i]||path[0];
  var porque = i===start
    ? (i===0
        ? 'Es el punto de partida de tu ruta: te da las bases para trabajar con '+ (stack()?stack().nombre:'IA') +' con confianza.'
        : 'Como ya manejas lo básico, partimos directo en este y te dejamos la ruta para seguir avanzando.')
    : 'El curso de tu punto de entrada es gratuito, así que regalamos este de la misma ruta, que sí es pagado, para que tu regalo tenga valor real.';
  return {titulo:c.t, prov:c.prov, url:c.url, desc:'Curso de cortesía', porque:porque, idx:i};
}

function temaUsaNivelTema(){ return state.tema!=='investigar'; }

/* Stepper del proceso completo; termina siempre en Roadmap. */
function stepper(cur, dark){
  var seq=[{k:'tema',l:'Objetivo'},{k:'stack',l:'Herramienta'},{k:'nivelIA',l:'Nivel IA'}];
  if(temaUsaNivelTema()) seq.push({k:'nivelTema',l:'Nivel tema'});
  seq.push({k:'roadmap',l:'Roadmap'});
  var ci=seq.map(function(s){return s.k;}).indexOf(cur);
  var check='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l4.5 4.5L19 7"/></svg>';
  var flag='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg>';
  var out='';
  seq.forEach(function(s,i){
    var last=i===seq.length-1;
    var st=i<ci?'done':(i===ci?'cur':'todo');
    var inner = last?flag:(i<ci?check:(i+1));
    var val=pasoElegido(s.k);
    out+='<span class="pstep '+st+(last?' goal':'')+'" data-go="'+(i+1)+'" role="button" tabindex="0"><span class="pnode">'+inner+'</span>'+
      '<span class="plabel">'+s.l+'</span>'+
      (val?'<span class="pval">'+esc(val)+'</span>':'')+'</span>';
    if(!last) out+='<span class="pline'+(i<ci?' on':'')+'"></span>';
  });
  return '<div class="stepper'+(dark?' on-dark':'')+'">'+out+'</div>';
}

/* Valor que el usuario eligió en cada paso (para mostrarlo pequeño bajo el rótulo). */
function pasoElegido(k){
  if(k==='tema')      return state.tema && tema() ? cap(tema().corto||tema().titulo) : '';
  if(k==='stack')     return state.stack && stack() ? stack().nombre : '';
  if(k==='nivelIA')   return state.nivelIA && nivelIA() ? nivelIA().nombre : '';
  if(k==='nivelTema') return state.nivelTema && nivelTema() ? nivelTema().nombre : '';
  return '';
}

function cap(s){return s? s.charAt(0).toUpperCase()+s.slice(1) : s;}

function recorrido(){
  var picks=[state.tema, state.stack, state.nivelIA];
  var chips=picks.map(function(p,i){return '<span class="s'+(p?' on':'')+'">0'+(i+1)+'</span>';}).join('');

  var lab=hechos?('<b>Tu recorrido</b><span>'+hechos+' de 3 elegidos</span>')

  return '<div class="recorrido"><span class="steps">'+chips+'</span><span class="lab">'+lab+'</span></div>';

function validEmail(e){return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);}

async function enviar(form){
  var msg=document.getElementById('formMsg');
  var nombre=form.nombre.value.trim(), email=form.email.value.trim(), empresa='';
  ['f-nombre','f-email'].forEach(function(id){var el=document.getElementById(id); if(el) el.style.borderColor='';});
  function bad(id,txt){ msg.innerHTML='<div class="msg err">'+txt+'</div>'; var el=document.getElementById(id); if(el){ el.style.borderColor='var(--terra)'; el.focus(); } }
  if(!nombre){ bad('f-nombre','Escribe tu nombre y apellido.'); return; }
  if(!validEmail(email)){ bad('f-email','El correo no es válido: debe incluir una @ y un dominio, por ejemplo nombre@empresa.cl'); return; }

  var t=tema(), s=stack(), nia=nivelIA(), ntm=nivelTema(), cr=cursoRecomendado();
  var nivelTemaTxt=(temaUsaNivelTema()&&ntm)?ntm.nombre:'—';
  var regaloVals=Array.prototype.map.call(document.querySelectorAll('input[name=regalo]:checked'), function(i){return i.value;});
  if(!regaloVals.length){ msg.innerHTML='<div class="msg err">Elige al menos una opción de regalo.</div>'; return; }
  var regaloMap={curso:cr.titulo, licencia:'Licencia de Claude (probar la herramienta)', consultor:'Hora 1:1 con un consultor Montblanc'};
  var regaloLabels=regaloVals.map(function(v){return regaloMap[v]||v;});
  var regaloTxt=regaloLabels.join(' + ');
  var regaloUrl=regaloVals.indexOf('curso')>=0?(cr.url||''):'';
  state.regalo={tipos:regaloVals, labels:regaloLabels, label:regaloTxt};
  var payload={
    nombre:nombre, email:email, empresa:empresa,
    tema:t.titulo, stack:s.nombre, nivelIA:nia.nombre, nivelTema:nivelTemaTxt,
    curso:regaloTxt, regalosTexto:regaloTxt,
    fecha:new Date().toISOString(), fechaLocal:new Date().toLocaleString('es-CL')
  };

  // Antibot: si el campo oculto viene lleno, es un robot — simulamos éxito y salimos.
  if(form.website && form.website.value){ state.enviado=true; render(); return; }

  var btn=document.getElementById('submitBtn');
  btn.disabled=true; btn.textContent='Enviando…';

  // 1) Dentro del artifact de Montblanc: se registra con la capability db.
  var db=null;
  try{ db = window.claude && claude.use ? await claude.use('db') : null; }catch(e){ db=null; }
  if(db){
    try{ await db.collection('solicitudes').add(payload); state.enviado=true; render(); }
    catch(e){ btn.disabled=false; btn.textContent='Solicitar mi curso';
      msg.innerHTML='<div class="msg err">No pudimos registrar tu solicitud ('+esc(e&&e.code?e.code:'error')+'). Intenta de nuevo o contáctanos.</div>'; }
    return;
  }

  // 2) Página propia (clientes externos): se registra en Supabase.
  var SUPA_URL=(window.SUPABASE_URL||''), SUPA_KEY=(window.SUPABASE_ANON_KEY||'');
  if(!SUPA_URL || /__/.test(SUPA_URL) || !SUPA_KEY || /__/.test(SUPA_KEY)){
    btn.disabled=false; btn.textContent='Solicitar mi curso';
    msg.innerHTML='<div class="msg err">El registro aún no está configurado. Avísale a Montblanc.</div>'; return;
  }
  var row={ nombre:nombre, email:email, empresa:empresa,
    tema:t.titulo, herramienta:s.nombre, nivel_ia:nia.nombre, nivel_tema:nivelTemaTxt,
    curso:regaloTxt, url_curso:regaloUrl };
  try{
    var resp=await fetch(SUPA_URL.replace(/\/$/,'')+'/rest/v1/solicitudes',{
      method:'POST',
      headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},
      body:JSON.stringify(row)
    });
    if(!resp.ok) throw new Error('HTTP '+resp.status);
    state.enviado=true; render();
  }catch(e){
    btn.disabled=false; btn.textContent='Solicitar mi curso';
    msg.innerHTML='<div class="msg err">No pudimos registrar tu solicitud. Revisa tu conexión e intenta de nuevo.</div>';
  }
}

function bind(){
  // navegación por data-go
  Array.prototype.forEach.call(stage.querySelectorAll('[data-go]'), function(b){
    b.addEventListener('click', function(){ goto(parseInt(b.getAttribute('data-go'),10)); });
  });
  // opciones (tema/stack/nivel)
  Array.prototype.forEach.call(stage.querySelectorAll('.opt'), function(b){
    b.addEventListener('click', function(){
      var kind=b.getAttribute('data-kind'), id=b.getAttribute('data-id');
      if(kind==='tema'){ state.tema=id; var pf=STACK_FIT[id]||[]; if(state.stack && pf.indexOf(state.stack)<0) state.stack=null; }
      else if(kind==='stack') state.stack=id;
      else if(kind==='nivelIA') state.nivelIA=id;
      else state.nivelTema=id;
      // Nivel IA: en Investigación saltamos el nivel del tema y vamos directo al Roadmap.
      var next = kind==='tema'?2 : kind==='stack'?3 : kind==='nivelIA'?(temaUsaNivelTema()?4:5) : 5;
      goto(next);
    });
  });
  // descargar roadmap
  var dl=document.getElementById('downloadBtn');
  if(dl) dl.addEventListener('click', descargarRoadmap);
  // selección de tema (orbital de portada + tarjetas de la pantalla navy)
  Array.prototype.forEach.call(stage.querySelectorAll('[data-pick-tema]'), function(b){
    b.addEventListener('click', function(){
      var id=b.getAttribute('data-pick-tema');
      state.tema=id; var pf=STACK_FIT[id]||[]; if(state.stack && pf.indexOf(state.stack)<0) state.stack=null;
      goto(2);
    });
  });
  // tema al azar
  var rnd=document.getElementById('randomBtn');
  if(rnd) rnd.addEventListener('click', function(){
    var tv=temasVisibles(); var t=tv[Math.floor(Math.random()*tv.length)];
    state.tema=t.id; var pf=STACK_FIT[t.id]||[]; if(state.stack && pf.indexOf(state.stack)<0) state.stack=null;
    goto(2);
  });
  // copiar prompt
  var copyBtn=document.getElementById('copyBtn');
  if(copyBtn) copyBtn.addEventListener('click', function(){
    var raw=tema().prompt;
    function done(){copyBtn.classList.add('done');copyBtn.querySelector('span').textContent='¡Copiado!';
      setTimeout(function(){copyBtn.classList.remove('done');copyBtn.querySelector('span').textContent='Copiar prompt';},1800);}
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(raw).then(done).catch(selectFallback);}
    else selectFallback();
    function selectFallback(){var r=document.createRange();r.selectNodeContents(document.getElementById('promptTxt'));
      var sel=window.getSelection();sel.removeAllRanges();sel.addRange(r);done();}
  });
  // formulario
  var form=document.getElementById('claimForm');
  if(form){
    form.addEventListener('submit', function(ev){ ev.preventDefault(); enviar(form); });
    var sbtn=document.getElementById('submitBtn');
    function chkReady(){ var ok=form.nombre.value.trim() && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(form.email.value.trim()); if(sbtn) sbtn.classList.toggle('ready', !!ok); }
    form.nombre.addEventListener('input', chkReady); form.email.addEventListener('input', chkReady); chkReady();
    // resaltar la opción de regalo elegida
    function markGopt(){ Array.prototype.forEach.call(stage.querySelectorAll('.gopt'), function(l){ var inp=l.querySelector('input'); l.classList.toggle('on', !!(inp && inp.checked)); }); }
    Array.prototype.forEach.call(stage.querySelectorAll('.gopt input[name=regalo]'), function(r){ r.addEventListener('change', markGopt); });
    markGopt();
  }
  // agendar con consultor (placeholder por definir)
  var ag=document.getElementById('agendaLink');
  if(ag) ag.addEventListener('click', function(ev){
    if(ag.getAttribute('data-placeholder')){ ev.preventDefault();
      alert('El agendamiento directo con un consultor estará disponible pronto.\n\nPor ahora, elige "Una hora con un consultor" en el formulario y te contactamos para coordinar.'); }
  });
}

function goto(step){
  // guardas: no saltar a preguntas posteriores sin respuesta previa
  if(step>=2 && !state.tema) step=1;
  if(step>=3 && !state.stack) step=2;
  if(step>=4 && !state.nivelIA) step=3;
  if(step===4 && !temaUsaNivelTema()) step=5;              // Investigación no usa nivel del tema
  if(step>=5 && temaUsaNivelTema() && !state.nivelTema) step=4;
  if(step===0){ state.tema=state.stack=state.nivelIA=state.nivelTema=null; state.enviado=false; state.regalo=null; }
  state.step=step; render();
}

/* Panel privado del dueño (Montblanc) */
(function(){
  var adminBtn=document.getElementById('adminBtn'), overlay=document.getElementById('ownerPanel');
  var body=document.getElementById('panelBody'), closeBtn=document.getElementById('panelClose');
  function close(){ overlay.classList.remove('open'); }
  closeBtn.addEventListener('click', close);
  overlay.addEventListener('click', function(e){ if(e.target===overlay) close(); });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') close(); });

  (async function(){
    try{
      var user = window.claude && claude.use ? await claude.use('user') : null;
      if(user && user.isOwner && user.isOwner()) adminBtn.hidden=false;
    }catch(e){}
  })();

  adminBtn.addEventListener('click', async function(){
    overlay.classList.add('open');
    body.innerHTML='<p style="color:var(--muted)">Cargando…</p>';
    var db=null;
    try{ db = window.claude && claude.use ? await claude.use('db') : null; }catch(e){ db=null; }
    if(!db){ body.innerHTML='<p style="color:var(--muted)">No se pudo cargar el registro en esta vista.</p>'; return; }
    try{
      var snap = await db.collection('solicitudes').get();
      var docs = snap.docs.map(function(d){ return d.data(); })
        .sort(function(a,b){ return String(b.fecha||'').localeCompare(String(a.fecha||'')); });
      if(!docs.length){ body.innerHTML='<p style="color:var(--muted)">Aún no hay solicitudes.</p>'; return; }
      var html='<p class="count-line">'+docs.length+' solicitud'+(docs.length===1?'':'es')+'</p>';
      html += docs.map(function(s){
        var meta=['tema','stack','nivelIA','nivelTema','nivel'].map(function(k){ return s[k]?'<span class="mtag">'+esc(s[k])+'</span>':''; }).join('');
        return '<div class="sol"><div class="top"><span class="nm">'+esc(s.nombre||'—')+' · '+esc(s.empresa||'—')+
          '</span><span class="dt">'+esc(s.fechaLocal||s.fecha||'')+'</span></div>'+
          '<div class="em">'+esc(s.email||'')+'</div>'+
          '<div class="meta">'+meta+'</div>'+
          '<div class="reg">Curso solicitado: <b>'+esc(s.curso||s.regalosTexto||'—')+'</b></div></div>';
      }).join('');
      body.innerHTML=html;
    }catch(e){
      body.innerHTML='<p style="color:var(--muted)">Error al leer el registro ('+esc(e&&e.code?e.code:'?')+').</p>';
    }
  });
})();
